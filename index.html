<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The two faces the first screen paints with. The stylesheet that declares
         them arrives one round trip after this document, so preloading takes the
         font fetch off the critical path instead of behind the CSS fetch. Only
         these two: the italics are below the fold, and preloading them would
         compete with resources the visitor needs sooner. -->
    <link rel="preload" href="/fonts/JosefinSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leandro Sousa | Software Tester</title>
    <meta name="description" content="Junior QA Tester | Manual Testing • Test Automation • Agile" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leandro Sousa | Software Tester" />
    <meta property="og:description" content="Junior QA Tester | Manual Testing • Test Automation • Agile" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191a1e" />
    <script>
      (() => {
        const dark = '(prefers-color-scheme: dark)';
        let preference = 'system';
        try {
          const stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch (error) {}
        const theme = preference === 'system' ? (matchMedia(dark).matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
